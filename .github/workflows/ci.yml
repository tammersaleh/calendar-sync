name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          # Use git status (not git diff --exit-code) so this works before
          # any deps are added and go.sum doesn't yet exist.
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod or go.sum changed after 'go mod tidy':"
            git status --porcelain go.mod go.sum
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Build
        run: mise run build

      - name: Test
        run: mise run test

      - name: Lint
        run: mise run lint

      - name: GoReleaser config check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

      - name: GoReleaser snapshot build
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean --skip=publish
