version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: calendar-sync
    main: ./cmd/calendar-sync
    binary: calendar-sync
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/tammersaleh/calendar-sync/cmd.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  mode: append

homebrew_casks:
  - name: calendar-sync
    binaries:
      - calendar-sync
    repository:
      owner: tammersaleh
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/tammersaleh/calendar-sync
    description: Google Calendar event mirroring tool
    hooks:
      post:
        # Restart the launchd agent so `brew upgrade` picks up the new
        # binary. A running daemon keeps executing the old binary's mmap'd
        # code. On a cold install the agent isn't loaded, so the silent
        # `launchctl print` probe fails and kickstart is skipped. Only the
        # default label is covered. Custom `--label` installs still need
        # `calendar-sync uninstall && calendar-sync install` after upgrade.
        # The steps DSL has no uid token or exit-status guard, hence sh.
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/calendar-sync"]
          run "/bin/sh",
              args:         ["-c", 's="gui/$(/usr/bin/id -u)/org.calendar-sync.agent"; /bin/launchctl print "$s" >/dev/null 2>&1 || exit 0; /bin/launchctl kickstart -k "$s"'],
              must_succeed: false
