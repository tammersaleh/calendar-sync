version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: calendar-sync
    main: ./cmd/calendar-sync
    binary: calendar-sync
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/tammersaleh/calendar-sync/cmd.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  mode: append

homebrew_casks:
  - name: calendar-sync
    binaries:
      - calendar-sync
    repository:
      owner: tammersaleh
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/tammersaleh/calendar-sync
    description: Google Calendar event mirroring tool
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/calendar-sync"]

            # Restart the launchd agent if it's currently loaded so
            # `brew upgrade calendar-sync` picks up the new binary
            # automatically. Without this, the running daemon keeps
            # executing the prior binary's mmap'd code (kernel caches
            # the file, on-disk replacement doesn't bounce the process)
            # and the user has to run `calendar-sync uninstall &&
            # calendar-sync install` by hand.
            #
            # Cold install: launchctl print fails (agent not loaded),
            # the kickstart skips, and the user runs `calendar-sync
            # install` to load the agent for the first time. The
            # probe's stderr is suppressed so a normal cold install
            # doesn't print "Could not find service" through brew.
            #
            # Custom-label installs (`calendar-sync install --label
            # foo`) are NOT covered by this hook - the postflight only
            # knows the default label. Users who customized the label
            # need to keep using the manual uninstall/install dance on
            # upgrade.
            #
            # must_succeed: false on both calls so a transient
            # launchctl issue doesn't fail the brew upgrade itself.
            uid = Process.uid
            label = "org.calendar-sync.agent"
            loaded = system_command "/bin/launchctl",
              args: ["print", "gui/#{uid}/#{label}"],
              must_succeed: false,
              print_stderr: false
            if loaded.success?
              system_command "/bin/launchctl",
                args: ["kickstart", "-k", "gui/#{uid}/#{label}"],
                must_succeed: false
            end
          end
